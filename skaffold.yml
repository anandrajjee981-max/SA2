apiVersion: skaffold/v4beta13
kind: Config
metadata:
  name: capstone

build:
  # Add this tagPolicy block to force custom or "latest" tags
  tagPolicy:
    envTemplate:
      template: "{{.IMAGE_NAME}}:latest"
      
  artifacts:
  - image: sandbox
    context: sandbox
    docker:
      dockerfile: dockerfile  
    sync:
      manual:
        - src: 'src/**/*.js'
          dest: .
        - src: 'src/**/*.json'
          dest: .
        - src: 'server.js'
          dest: .

  - image: agent
    context: sandbox/agent
    docker:
      dockerfile: dockerfile

  - image: template
    context: sandbox/template
    docker:
      dockerfile: dockerfile

  - image: router
    context: sandbox/router
    docker:
      dockerfile: dockerfile

  - image: ai
    context: Ai
    docker:
      dockerfile: dockerfile

manifests:
  rawYaml:
    - k8s/sandbox-deployment.yml
    - k8s/sandbox-service.yml
    - k8s/router-deployment.yml
    - k8s/router-service.yml
    - k8s/ingress.yml
    - k8s/rbac.yaml
    - k8s/ai-secret.yml
    - k8s/ai-deployment.yml
    - k8s/ai-service.yml